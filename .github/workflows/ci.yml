name: ci

on:
  push:
    branches: [main, dev]
  pull_request:
  # Weekly full-parity run (P1-41): a scheduled run has no diff for
  # paths-filter, so `changes` special-cases it to code=true and only the
  # harness job opts into running on schedule (see its `if:`) -- off-peak
  # minute chosen to avoid the top-of-hour stampede.
  schedule:
    - cron: '17 4 * * 1'

# One run per ref: a newer push to the same branch cancels the stale run
# instead of letting both burn a 4-core runner to completion (P1-41).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Classify the pushed/PR'd diff. `code` is true when any changed file is not
  # markdown, so a docs-only change skips the heavy jobs below. `test` ignores
  # this output and always runs. On schedule there is no diff at all: the
  # filter step is skipped and the override step reports code=true so the
  # opted-in harness job may run.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.schedule_override.outputs.code || steps.filter.outputs.code }}
    steps:
      # Push: base == head makes the action diff against the event's `before`
      # SHA, i.e. just the pushed commits. PR: `base` is ignored (token is set)
      # and the PR base is used via the API instead.
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name != 'schedule'
        with:
          base: ${{ github.event_name == 'push' && github.ref || '' }}
          predicate-quantifier: some-with-excludes
          filters: |
            code:
              - '**'
              - '!*.md'
              - '!**/*.md'

      - id: schedule_override
        if: github.event_name == 'schedule'
        run: echo "code=true" >> "$GITHUB_OUTPUT"

  test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # hana's build.zig.zon pins minimum_zig_version = 0.16.0; match it for
      # reproducible CI rather than drifting on a moving `master`.
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      # Content-addressed build cache: a warm run only recompiles what the
      # diff touched. Keyed on the Zig sources (+ sha) so a source change saves
      # a fresh cache, with prefix restore-keys falling back to the previous
      # one. The modularity job has its own key (different cache path).
      - name: Cache zig build cache
        uses: actions/cache@v4
        with:
          path: .zig-cache
          key: zig-${{ runner.os }}-${{ hashFiles('**/*.zig', 'build.zig', 'build.zig.zon') }}-${{ github.sha }}
          restore-keys: |
            zig-${{ runner.os }}-${{ hashFiles('**/*.zig', 'build.zig', 'build.zig.zon') }}-
            zig-${{ runner.os }}-

      # Covers build.zig.zon's `.links` table. libxrandr-dev is X11's randr,
      # not xcb's — xcb-randr and xcb-keysyms need their own -dev packages.
      - name: Install X11 dev dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb1-dev libxcb-xkb-dev libxcb-keysyms1-dev libxcb-randr0-dev libxcb-cursor-dev libxkbcommon-dev libxkbcommon-x11-dev libcairo2-dev libpango1.0-dev libxrandr-dev

      # Living docs must not rot: every path-like token in README/AGENTS/
      # config README still exists (P2-77). Pure python3 scan, no zig — runs
      # before the fmt gate so a docs-only PR still gets checked (the `test`
      # job ignores the paths-filter `code` output on purpose).
      - name: Doc path guard
        run: ./dev/scripts/check-doc-paths.sh

      - name: zig fmt --check
        run: zig fmt --check src

      # `check` is a no-emit type-check + plugin-template gate + layer guards
      # (build.zig wireCheckSteps): full Sema, no codegen. Checked before the
      # tests because it is the cheaper signal. Debug keeps it identical to
      # `check-before-commit.sh`.
      - name: Type-check + plugin-template + layer guards
        run: zig build check -Doptimize=Debug

      # xtest.sh starts an isolated Xvfb and sets HANA_REQUIRE_X=1 so every
      # display-gated test actually runs instead of self-skipping (a bare
      # `zig build test` reports green with 49 tests silently skipped).
      # Debug is several times cheaper than the ReleaseFast default
      # (resolveOptimize) and it also runs the std.debug.assert coverage
      # ReleaseFast compiles out.
      - name: Unit tests (model / tiling / sync / config / workspaces / input)
        run: ./dev/scripts/xtest.sh zig build test -Doptimize=Debug

      # Bare `zig build` = ReleaseFast (resolveOptimize): this is the codegen +
      # link proof the no-emit check step deliberately does not do.
      - name: Build
        run: zig build

  # End-to-end X scenarios on their own isolated Xvfb, against recorded
  # goldens under dev/harness/golden/. PRs get the fast smoke subset so a
  # break in the real event loop / reconcile path fails the PR without paying
  # the full 23-scenario wall-clock; the full run belongs to the default
  # branch (a scheduled/merge job can widen this list).
  e2e-smoke:
    needs: changes
    if: github.event_name != 'schedule' && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      # xdotool drives the synthetic input, x11-utils provides xprop/xwininfo
      # for the golden diff, x11-xserver-utils provides xset for the display
      # preflight, xvfb is the server the harness starts per scenario
      # (run-scenario.sh owns its lifetime).
      - name: Install X11 dev dependencies + harness tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb1-dev libxcb-xkb-dev libxcb-keysyms1-dev libxcb-randr0-dev libxcb-cursor-dev libxkbcommon-dev libxkbcommon-x11-dev libcairo2-dev libpango1.0-dev libxrandr-dev xvfb xdotool x11-utils x11-xserver-utils

      # Debug build (D2): the log-based golden assertions (STATE DUMP,
      # Focused:, S22/S23 greps) need the info/debug log sites a release
      # build comptime-elides.
      - name: Build Debug (the harness runs the installed binary)
        run: zig build -Doptimize=Debug

      # The shipped config/ tree IS the documented user experience, so it
      # gets validated through the real load path (entry file + includes +
      # merge), not only through the unit test that stages the same three
      # files in a sandbox. --check-config needs no display (it exits before
      # any X11 work) and exits 1 on ANY diagnostic, so CI fails on a dead
      # knob, a mis-cased section, or a parse break. Debug keeps the warn
      # scopes visible; a release build comptime-elides them and the mode
      # refuses with exit 2. XDG_CONFIG_HOME points at a tree whose hana/
      # is the repo's config/ (only config.toml is read from a dir; its
      # include list names the rest).
      - name: Validate shipped config (hana --check-config)
        run: |
          mkdir -p /tmp/hana-check-home
          ln -s "$PWD/config" /tmp/hana-check-home/hana
          XDG_CONFIG_HOME=/tmp/hana-check-home ./zig-out/bin/hana --check-config

      - name: E2E smoke subset (S01 spawn-tiled / S02 close / S11 configure-honored / S18 ewmh-fullscreen / S22 restore / S24 dialog-float)
        run: |
          cd dev/harness
          ./run-scenario.sh --compare S01-spawn-tiled S02-close S11-configure-honored S18-ewmh-fullscreen S22-restore S24-dialog-float

      # A red e2e run must leave downloadable diagnosis (P1-41): every
      # scenario's out/<SC>/ (snapshots, hana.log, xvfb.log, normalized
      # artifacts) plus the per-scenario golden diffs the compare step writes
      # to ${TMPDIR:-/tmp}. Absolute paths are fine in upload-artifact, and
      # both TMPDIR spellings are covered because the runner may or may not
      # export TMPDIR.
      - name: Upload diagnosis artifacts (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-smoke-diagnosis
          if-no-files-found: warn
          retention-days: 14
          path: |
            dev/harness/out/
            /tmp/hana-diff-*.txt
            ${{ runner.temp }}/hana-diff-*.txt

  # Feature-deletion matrix: each optional subsystem is removed and the tree
  # must still compile. Own job rather than part of the default `check`
  # (independent of the test job, so both run in parallel). Skipped on
  # docs-only changes.
  modularity:
    needs: changes
    if: github.event_name != 'schedule' && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      # Each scenario builds in its own persistent copy under /tmp, and the
      # script keeps each copy's .zig-cache between runs. Caching that directory
      # turns the cold matrix (~30 Debug builds) into rsync + incremental zig
      # build on the next run. Its own key because the path is different from
      # the test job's .zig-cache.
      - name: Cache modularity scenario caches
        uses: actions/cache@v4
        with:
          path: /tmp/hana-modularity-test
          key: mod-${{ runner.os }}-${{ hashFiles('**/*.zig', 'build.zig', 'build.zig.zon') }}-${{ github.sha }}
          restore-keys: |
            mod-${{ runner.os }}-${{ hashFiles('**/*.zig', 'build.zig', 'build.zig.zon') }}-
            mod-${{ runner.os }}-

      - name: Install X11 dev dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb1-dev libxcb-xkb-dev libxcb-keysyms1-dev libxcb-randr0-dev libxcb-cursor-dev libxkbcommon-dev libxkbcommon-x11-dev libcairo2-dev libpango1.0-dev libxrandr-dev

      # No -j: the script sizes zig -j itself as nproc / -P (4 scenarios at
      # once by default, which fills a 4-core runner without oversubscribing).
      # Scenario builds default to -O Debug; the test job's ReleaseFast
      # `zig build` is the release-profile proof.
      - name: Feature-deletion modularity matrix
        run: ./dev/scripts/check-modularity.sh

  # Behavioral parity harness: boots a private Xvfb and replays the scenarios
  # against recorded goldens. Runs on pushes to dev only (slow), and only when
  # the push touched more than markdown -- plus the weekly scheduled run
  # (P1-41), which lands on the default branch and carries code=true from the
  # changes job's override, so the FULL set replays once a week on main.
  #
  # GATING: all S01–S24 goldens were recaptured against the current
  # focus/stacking behavior and `./dev/harness/run-scenario.sh --compare` is
  # green locally, so parity drift now fails CI.
  harness:
    needs: changes
    if: (github.event_name == 'schedule' || github.ref == 'refs/heads/dev') && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Install X11 + harness tools
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xdotool x11-utils x11-xserver-utils libxcb1-dev libxcb-xkb-dev libxcb-keysyms1-dev libxcb-randr0-dev libxcb-cursor-dev libxkbcommon-dev libxkbcommon-x11-dev libcairo2-dev libpango1.0-dev libxrandr-dev perl

      # Debug build (D2): the scenarios' log-based assertions need the
      # info/debug log sites a release build comptime-elides.
      - name: Build Debug
        run: zig build -Doptimize=Debug

      - name: Golden parity replay
        working-directory: dev/harness
        run: ./run-scenario.sh --compare $(ls scenarios/*.sh | sed 's|scenarios/||; s|\.sh$||')

      # Same diagnosis artifacts as e2e-smoke (P1-41): the full run's
      # out/<SC>/ tree and the golden diffs under ${TMPDIR:-/tmp}.
      - name: Upload diagnosis artifacts (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: harness-diagnosis
          if-no-files-found: warn
          retention-days: 14
          path: |
            dev/harness/out/
            /tmp/hana-diff-*.txt
            ${{ runner.temp }}/hana-diff-*.txt
