name: ci

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # hana's build.zig.zon pins minimum_zig_version = 0.16.0; match it for
      # reproducible CI rather than drifting on a moving `master`.
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Install X11 dev dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb1-dev libxcb-cursor-dev libxkbcommon-dev libxkbcommon-x11-dev libcairo2-dev libpango1.0-dev libxrandr-dev

      - name: zig fmt --check
        run: zig fmt --check src

      - name: Unit tests (model / tiling / sync / config / workspaces / input)
        run: zig build test

      - name: Layer guards (single-writer sync, xcb-free model/tiling)
        run: zig build check

      - name: Build
        run: zig build

  # Feature-deletion matrix: each optional subsystem is removed and the tree
  # must still compile. Heavy (cold build per scenario), so it is its own job
  # rather than part of the default `check`.
  modularity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Install X11 dev dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb1-dev libxcb-cursor-dev libxkbcommon-dev libxkbcommon-x11-dev libcairo2-dev libpango1.0-dev libxrandr-dev

      - name: Feature-deletion modularity matrix
        run: ./dev/scripts/check-modularity.sh -j 4

  # Behavioral parity harness: boots a private Xvfb and replays the scenarios
  # against recorded goldens. Runs on pushes to dev only (slow).
  harness:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Install X11 + harness tools
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xdotool x11-utils libxcb1-dev libxcb-cursor-dev libxkbcommon-dev libxkbcommon-x11-dev libcairo2-dev libpango1.0-dev libxrandr-dev perl

      # Default `zig build` is Debug here (the optimize option is `-Drelease`,
      # and Debug is the default), which the scenarios need for dump_state/
      # info-level logs.
      - name: Build
        run: zig build

      - name: Golden parity replay
        working-directory: dev/harness
        run: ./run-scenario.sh --compare $(ls scenarios/*.sh | sed 's|scenarios/||; s|\.sh$||')
