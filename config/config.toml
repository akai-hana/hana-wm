### hana WM configuration ###

# TOML config files to load.
# - Files placed in the main config directory are auto-loaded (alphabetically).
# - Files placed in subdirectories must be added here manually.
# - Multiple files are unified at runtime; later files win on scalar conflicts.
#
# See config/README.md for value format details (ScalableValue, glob expansion, etc.)
include = ["themes/akai.toml"]

# ---------------------------------------------------------------------------
# Tiling
# ---------------------------------------------------------------------------
[tiling]
enabled = true

# When false (default), each workspace remembers its own layout independently.
# When true,  changing the layout on one workspace changes it everywhere.
global_layout = false

# Available layouts, in cycle order.
# - Layouts not listed here are unavailable at runtime.
# - Omitting the array entirely enables every layout in src/tiling/layouts/.
#
# Inline syntax: "name" [, variant] [, workspace_list]
#
#   name           Layout module name (master-stack, monocle, grid, fibonacci, scroll, leaf)
#   variant        Behavioral variant word (optional)
#   workspace_list Comma-separated 1-based indices restricting the layout to specific workspaces (optional)
#
# Variant reference:
#   master-stack  "lifo" (default) | "fifo"       — new window lands in master or stack
#   monocle       "gapless" (default) | "gaps"     — honour window gaps like other layouts
#   grid          "rigid" (default) | "relaxed"    — incomplete last row: leave gaps or expand
#   fibonacci     (no variants)
#
# Layout indicator overrides (shown in bar): see [tiling.layouts.<name>].indicator
layouts = [
    "master-stack",                            # lifo / fifo
    "monocle",      "gaps",                    # gapless / gaps
    "grid",         "relaxed",                 # rigid / relaxed
    "fibonacci",                               # no variants
    "scroll",
    # "leaf",
]

# -- Layout-specific settings --

[tiling.layouts.master-stack]
count = 1        # Number of windows in the master area [1..]
side  = "left"   # "left" / "right" — master area on this side of the screen
width = 50%      # Master area width [5%-95%] or exact pixels (0-N]px
variants = "lifo" # "lifo" = new window spawns in master; "fifo" = spawns in stack

# Override the 3-character indicator shown in the bar for this layout.
# Defaults to the variant name ("LIF" or "FIF") when not set.
# indicator = "M-S"

[tiling.layouts.monocle]
variants = "gaps" # "gapless" (true fullscreen) | "gaps" (honour gap settings)
# indicator = "MON"

[tiling.layouts.grid]
variants = "relaxed" # "rigid" (strict grid) | "relaxed" (last window expands)
# indicator = "GRD"

[tiling.layouts.fibonacci]
# Fibonacci has no behavioral variants.
# indicator = "FIB"

# -- Window aesthetics --
# Defaults below; the theme file (themes/akai.toml) typically overrides these.
# [tiling.aesthetics]
# gap_width        = 10px  # Window gap size [0%-200%] or [0-N]px
# border_width     = 2px   # Window border width [0%-200%] or [0-N]px
# border_focused   = "#5294E2"
# border_unfocused = "#383C4A"
# min_window_dim   = 50    # Minimum tiled window dimension in pixels [1..]

# -- Drag & drop --
[drag]
enabled       = true
snap_distance = 16 # Pixel distance at which windows snap together

# ---------------------------------------------------------------------------
# Workspaces
# ---------------------------------------------------------------------------
[workspaces]
count = 8 # Number of workspaces [1-64]

# ---------------------------------------------------------------------------
# Bar
# ---------------------------------------------------------------------------
[bar]
enabled  = true
position = "bottom" # "top" / "bottom" — can be toggled at runtime

# -- Bar layout --
# Segments are placed into left/center/right anchor groups.
# Available segments: "workspaces", "title", "clock", "layout", "variants"
[bar.layout.left]
segments = ["workspaces", "layout", "variants"]

[bar.layout.center]
segments = ["title"]

[bar.layout.right]
segments = ["clock"]

# -- Bar appearance --
# Defaults below; the theme file typically overrides these.
# [bar]
# font_size           = 10%     # Font size as % of bar height [0%-200%] or [0-N]px
# segment_spacing     = 12px    # Spacing between bar segments [0%-200%] or [0-N]px
# indicator_size      = 30%     # Workspace indicator size [0%-200%] or [0-N]px
# workspace_tag_width = 100%    # Workspace tag width [0%-200%] or [0-N]px
# height              = auto    # Bar height in [0%-200%] or [0-N]px; absent = auto-calculate
# transparency        = 1.0     # [0.0-1.0] / [0%-100%]; 1.0 or 100% = fully opaque
#
# indicator_location  = "up-left"  # Workspace indicator position:
#                                  #   "up", "down", "left", "right",
#                                  #   "up-left", "up-right", "down-left", "down-right"
# indicator_padding   = 0.1        # Indicator padding ratio [0.0-1.0]
# indicator_color     = auto       # Falls back to fg when absent
#
# vim_mode            = true   # Full vim modal editing in prompt
# carousel_enabled    = true   # Marquee scrolling for overflowing titles
# carousel_speed_px_s = 125    # Carousel scroll speed in px/s [1-1000]
#
# clock_format        = auto   # strftime format string; absent = default
# drun_prompt         = auto   # Command runner prompt; absent = "run: "
#
# bg          = "#222222"  # Background color
# fg          = "#BBBBBB"  # Foreground color
# selected_bg = "#005577"  # Active workspace indicator background
# selected_fg = "#EEEEEE"  # Active workspace indicator foreground
# accent_color = auto      # Default accent; falls back to selected_bg
#
# fonts  = ["monospace"]   # Font list; first is primary, others fill missing glyphs
# icons  = ["1".."9"]      # Workspace labels; array or single string (split into chars)
#
# [bar.colors]
# title           = auto  # Title segment accent (fallback: accent_color)
# title_unfocused = auto  # Unfocused title accent (fallback: bar bg)
# title_minimized = auto  # Minimized title accent (fallback: accent_color)
# drun_bg           = auto  # Command runner background (fallback: bar bg)
# drun_fg           = auto  # Command runner text (fallback: bar fg)
# drun_prompt_color = auto  # Command runner prompt (fallback: accent_color)

# ---------------------------------------------------------------------------
# Keybindings
# ---------------------------------------------------------------------------
[binds]
# -- Modifier & value placeholders --
Mod   = "Super"   # Super/Mod4, Alt/Mod1
kill  = "pkill -9" # Replaced where {kill} appears in action values

# -- Window management --
Mod+F       = "toggle_fullscreen"
Mod+Shift+F = "close_window"
Mod+Shift+Y = "reload"                 # Hot-reload config

Mod+T           = "minimize_window"
Mod+Shift+T     = "unminimize_lifo"
Mod+Alt+T       = "unminimize_fifo"
Mod+Shift+Alt+T = "unminimize_all"

# -- Tiling --
Mod+space        = "toggle_layout"          # Cycle layouts forward
Mod+Shift+space  = "toggle_layout_reverse"  # Cycle layouts backward
Mod+Alt+space    = "cycle_layout_variants"  # Cycle current layout's variants
Mod+Tab          = "swap_master_focus_swap" # Swap position of current and previous windows
Mod+Shift+Tab    = "swap_master"            # Swap positions and focus of current and previous windows
Mod+grave        = "toggle_prompt"
Mod+Middle_click = "toggle_floating_window" # Toggle clicked window between tiled and floating
Mod+scroll_up    = "scroll_view_right"
Mod+scroll_down  = "scroll_view_left"

# -- Master-stack layout --
Mod+H       = "decrease_master"      # Shrink master area width
Mod+L       = "increase_master"      # Grow master area width
Mod+Shift+H = "decrease_master_count"
Mod+Shift+L = "increase_master_count"
Mod+N       = "grow_stack_top"       # Grow topmost slave, shrink the rest evenly
Mod+O       = "grow_stack_bottom"    # Grow bottommost slave, shrink the rest evenly

# -- Focus cycling --
Mod+j         = "focus_next_window"
Mod+k         = "focus_prev_window"
Mod+Shift+j   = "move_window_next"
Mod+Shift+k   = "move_window_prev"

# -- Workspaces --
# Glob expansion: Mod+{1-4,Q,W,E,R} expands into individual binds.
# Workspace-indexed actions get a _N suffix appended automatically.
Mod+{1-4,Q,W,E,R} = "workspace"
Mod+5 = "all_workspaces"

# -- Workspace window sending --
Mod+Shift+{1-4,Q,W,E,R} = "move_to_workspace"
Mod+Alt+{1-4,Q,W,E,R}   = "toggle_tag"
Mod+Shift+5 = "move_to_all_workspaces"

# -- Bar --
Mod+B       = "toggle_bar_visibility"  # Show / hide
Mod+Shift+B = "toggle_bar_position"    # Top / bottom

# -- Emergency --
# Disables tiling, clears fullscreen, unmaps all windows, stops drag.
Mod+Shift+Escape = "emergency_recover"

# ---------------------------------------------------------------------------
# Workspace rules
# ---------------------------------------------------------------------------
# Maps window class names to workspaces. Two formats:
#
# Numbered arrays (workspace -> list of classes):
#   1 = ["firefox", "Navigator"]
#
# Class-keyed integers (class -> workspace):
#   firefox = 1
#
# Per-workspace sub-tables:
#   [workspace.rules.1]
#   firefox = true

[workspace.rules]
# Browser
1 = ["firefox", "Navigator"]
# Socials
2 = ["discord", "vesktop", "equibop"]
# Music
3 = ["com.github.th_ch.youtube_music"]
# Launchers
4 = ["OpenTabletDriver.UX"]
# Games
5 = ["steam", "steam.exe", "wine", "proton", "noita", "noita.exe", "osu!", "DDNet", "isaac-ng.exe", "java", "Minecraft", "Etterna"]
# Editors
6 = ["emacs"]
# Media
7 = ["prismlauncher", "freetube", "gimp", "stremio", "stremio-enhanced", "mpv"]
# Torrenting
8 = ["deluge"]
