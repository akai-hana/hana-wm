# Hana WM - Fallback Configuration
# This config is used when no config.toml is found

[tiling]
enabled     = true
layout      = "master"
master_side = "left"

master_count     = 1
master_width     = 55%
gap_width        = 12
border_width     = 4
min_window_dim   = 50
border_focused   = "#005577"
border_unfocused = "#444444"

[binds]
Mod = "Super"

# Terminal (will be auto-detected)
Mod+Return = "auto_terminal"

# Window management
Mod+Shift+F = "close"
Mod+Shift+G = "kill"
Mod+F       = "toggle_fullscreen"

# Tiling layout controls
Mod+Space       = "toggle_layout"
Mod+Shift+Space = "toggle_layout_reverse"
Mod+N           = "toggle_layout"
Mod+H           = "decrease_master"
Mod+L           = "increase_master"
Mod+Comma       = "increase_master_count"
Mod+Period      = "decrease_master_count"

# Workspaces 1-9
Mod+{1-9} = "workspace"

# Move window to workspace
Mod+Shift+{1-9} = "move_to_workspace"

# Bar toggle
Mod+B = "toggle_bar_visibility"
Mod+Shift+B = "toggle_bar_position"

# Config reload
Mod+Shift+T = "reload"

[bar]
position = "bottom"
font_size = 12
segment_spacing = 6

bg              = "#222222"
fg              = "#bbbbbb"
selected_bg     = "#005577"
selected_fg     = "#eeeeee"

primary_color     = "#005577"
secondary_color   = "#222222"
alternative_color = "#005577"
text_color        = "#bbbbbb"
indicator_size = 4

icons = ["1", "2", "3", "4", "5", "6", "7", "8", "9"]

# volume_format        = "VOL {pct}%"  # "{pct}" = level, "{state}" = mute/unmute
# volume_muted_format  = "MUTE"        # shown instead while the sink is muted
# systatus_items        = ["cpu", "mem"]  # systatus readouts; absent = every present-capable
#                             # readout in alphabetical registry order (batt, cpu, mem), [] = none

[bar.layout.left]
segments = ["workspaces", "layout"]

[bar.layout.center]
segments = ["title"]

[bar.layout.right]
segments = ["clock"]

[workspaces]
count = 9
