### Personal program binds ###
# This file is auto-loaded alongside config.toml; keys merge into the
# same [binds] table.
#
# To disable a bind, comment it out with #.

[binds]

# -- Web browsers --
Mod+A       = "MOZ_USE_XINPUT2=1 firefox"
Mod+Shift+A = "~/.local/bin/firefox-sync.sh xpmraevm.default-default; {kill} firefox"

# -- Chat / Socials --
Mod+S       = "equibop"
Mod+Shift+S = "{kill} electron"

# -- Terminal --
Mod+D       = "ghostty"
Mod+Shift+D = "{kill} ghostty"
Mod+I       = "xeyes"

# -- Games --
Mod+Z       = "prismlauncher"
Mod+Shift+Z = "distrobox enter aur -- ~/Games/factorio-vanilla"
Mod+X       = "TaterClient-DDNet"
Mod+Shift+X = "etterna"
Mod+C       = "steam steam://rungameid/1229490"
Mod+Shift+C = "steam"

# -- Media --
Mod+V       = "pear-desktop"
Mod+Shift+V = "stremio-enhanced"

# -- File manager --
Mod+Y       = "thunar"
Mod+Alt+Y   = "{kill} thunar"

# -- Wallpaper --
Mod+G       = "~/eudaimonia/shader-wallpaper/shadow/scripts/shader-switch.sh"
Mod+Shift+G = "~/eudaimonia/shader-wallpaper/shadow/scripts/shader-stop.sh"
