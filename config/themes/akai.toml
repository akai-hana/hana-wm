### akai: hana WM default theme ###

# - HEX color code values can be set to either of the following formats:
#   "#RRGGBB" / RRGGBB / 0xRRGGBB

[tiling.aesthetics]
# [0% - 200%] / [0 - N] px
## 100% = Entire display; 0% = disabled
gap_width        = 2%
border_width     = 1% #TODO: 100% doesn't cover 100% of the display.
#TODO: make config parser accept both N% and %N values (currently %N doesn't work).

# Borders follow the focus palette variables (from [bar] below)
border_focused   = primary_color
border_unfocused = secondary_color

[bar]
# Font
## First value is the default font used
## Subsequent values render in characters not included by first value (ej. non-ASCII)
fonts = [
    "FiraCode Nerd Font Propo Ret",
    "Noto Sans CJK JP", # japanese characters
]

# Bar height
## Auto-adapts to font size by default.
height = 3.5%

## Font size covers a percentage of the bar's area according to its height
## (e.g., 16% = font takes up 16% of the bar's vertical space)
font_size      = 70%
indicator_size = 25%

# Workspace labels/icons (1-N)
icons = ["あ", "か", "い", "は", "な", "つ", "ん", "で"]

segment_spacing    = 5%
indicator_padding  = 40%

#
## if neither is set
# indicator_focused   = "■"
# indicator_unfocused = "□"
indicator_location = "up-left"

# Workspace width as percentage of base (100% = 40px, 150% = 60px, or set exact pixels)
workspace_tag_width = 100%  # Default base width

# Bar transparency. Bare integers are percentages: 0% = fully transparent,
# 100% / 1.0 = fully opaque, 50% / 0.5 = half. (A bare `1` means 1% opacity,
# not 1.0; write `1.0` or `100%` for fully opaque.)
# With picom's gaussian blur, the bar will show blurred content behind it
transparency = 0% # [0.0 - 1.0] / [0% - 100%]

# drun command runner prompt string (default: "run: ")
drun_prompt = "$ "

#  Carousel (scrolling title) 
# carousel_enabled: set to false to disable scrolling entirely and use a
#   static ellipsis when the title overflows.
carousel_enabled = true

# Main color palette
## Core palette: the editable colors. Every accent below inherits from
## these four; change one here and the whole bar follows.
primary_color     = "#ac3232" # focused title / selected workspace / active border
secondary_color   = "#52263e" # unfocused title / inactive border
alternative_color = "#007373" # minimized title
text_color        = "#ebd9bc" # bar text (matches fg)

## Bar
## Colors that don't fit the palette stay hardcoded
bg = "#0d0d14"
fg = "#ebd9bc"

## Workspace tag indicators
selected_bg = primary_color  # follows primary_color
selected_fg = "#eeeeee"

# Per-segment accent colors inherit from the palette by reference
[bar.colors]
title           = primary_color    # focused title = primary_color
title_unfocused = secondary_color  # unfocused title = secondary_color
title_minimized = alternative_color # minimized title = alternative_color

# Per-segment text colors: any key that isn't a named color knob above is a
# segment registry name ("cpu", "mem", "volume", "brightness", "batt", ...).
# A segment with no entry falls back to the bar-wide fg (text_color).
# Systatus readouts read primary; slider controls read alternative.
cpu        = primary_color     # cpu readout text
mem        = primary_color     # memory readout text
volume     = alternative_color # volume slider text
brightness = alternative_color # brightness slider text

# drun command runner colors (all optional; omit to use bar-wide defaults)
 # drun_bg           = "#0d0d14"  # background (default: bar bg)
 # drun_fg           = "#ebd9bc"  # typed text  (default: bar fg)
 # drun_prompt_color = primary_color  # prompt text + cursor (default: primary_color)
