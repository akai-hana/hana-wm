#<!--*~># akai #<~~*|=>#
# hana's default theme #

# This is the theme I personally use on hana.
# It's commented with useful tips across, if you want to make your own theme. :)

# ------------------------------------------------------------------------------

# Color code values can be set to either of the following formats:
# ("#RRGGBB" / RRGGBB / 0xRRGGBB)

# Color palette knobs 
# (purely convenience aliases. you can do wtv u want.)
primary_color     = "#ac3232"
secondary_color   = "#52263e"
alternative_color = "#007373"

# Color knobs can also be mixed together by "adding" them up together, using the
# following syntax: `thing = <color_1> +(weight:N%) <color_2>`   # 75%-25% split

# The parentheses attached to the '+' determine the properties of the sum, so
# `+(weight:25%)` would mean 25% of <color_2> is mixed with 75% of <color_1>.

# ------------------------------------------------------------------------------

[tiling]

# Sizes can take exact pixels (N / Npx) or a percentage (N% / %N).
# Percentages are measured against the total display screen space.

# Since percentages ratio against your screen's resolution, they'll
# dynamically adapt to the display's resolution, occupying the same
# perceived space under different resolutions and aspect ratios.

border_width = 1%
gap_width    = 2%

border_focused   = primary_color
border_unfocused = secondary_color

# ------------------------------------------------------------------------------

[bar]

bg = "#0d0d14"
fg = text_color
text_color = "#ebd9bc"

# 100% / 1.0 = fully opaque, 0% / 0 = fully transparent.
# (Bare integers are not accepted here: write `1.0` or `100%`
# for fully opaque, `0.0` or `0%` for fully transparent.)
# With picom's gaussian blur, the bar will show blurred content behind it
transparency = 0% # [0.0 - 1.0] / [0% - 100%]

height = 3.25% #TODO: rename to bar_height
segment_spacing = 5%

# Fonts are prioritized in array order; first value is the default font used.
# Following fonts fill characters missing from previous ones (e.g. non-ASCII)
fonts = [
    "FiraCode Nerd Font Propo Ret",
    "Noto Sans CJK JP", # japanese workspace icons support
]

# When set as a percentage, this'll be the font's size in respect to bar height.
# e.g. `100%` => font is as big as it could be, without spilling out of the bar. 
font_size = 72.5%

# Basically, any value under 100% effectively acts as padding between the text
# and the bar's dimensions, and anything above 100% will overflow outside of it.

# ------------------------------------------------------------------------------

#TODO: add "[bar.workspace]" section, remove "workspace_" appending to variables

# Workspace labels/icons [1-N)
icons = ["あ", "か", "い", "は", "な", "つ", "ん", "で"]

indicator_focused   = "■"
indicator_unfocused = "□"

indicator_location = "up-left"
indicator_size     = 25%
indicator_padding  = 35%

# Percentage -> bar width in respect to height. 100% => squared workspace tags.
# You can go above 100% for rectangled tags.
workspace_tag_width = 100% #TODO: separate this knob into two: one for focused
                           # workspaces and another one for unfocused.

# drun command runner prompt string #TODO: make the default "$: "
drun_prompt = "$ "

# carousel_enabled: set to false to disable scrolling entirely and use a
#   static ellipsis when the title overflows.
carousel_enabled = true





## Workspace tag indicators
# The selected tag's icon TEXT and INDICATOR colors are set individually:
# selected_fg colors the icon text; selected_indicator_color colors the
# activity glyph inside the selected tag on its own (unset follows
# indicator_color, then selected_fg).
selected_bg              = primary_color # follows primary_color
selected_fg              = "#eeeeee"     # selected icon text color
selected_indicator_color = "#eeeeee"     # selected icon indicator color (individually set)

# Per-segment accent colors inherit from the palette by reference
[bar.properties]
title           = primary_color       # focused title = primary_color
title_unfocused = secondary_color     # unfocused title = secondary_color
title_minimized = alternative_color   # minimized title + slider fill = alternative_color

# Per-segment text properties: any key that isn't a named color knob above is
# a segment registry name ("cpu", "ram", "volume", "brightness", "batt", ...).
# The first color-carrying item sets the text color; trailing style flags
# (underline/bold/italic, bare = true or name=true/1) set its style, e.g.
# `volume = alternative_color bold`. A style-only entry keeps the default fg.
# A segment with no entry falls back to the bar-wide fg (text_color).
# Per-segment NUMBER colors: the segment name + "_value" recolors just the
# numeric readout (the "42%" in "CPU 42%"); the rest of the segment keeps its
# entry above. A segment with no `_value` entry colors its number like its
# label. Systatus readouts read secondary; slider text stays alternative,
# slider fill follows title_minimized (alternative).
cpu        = secondary_color   # cpu readout text
ram        = secondary_color   # memory readout text
volume     = alternative_color # volume slider text
brightness = alternative_color # brightness slider text

# Workspace tags use two of these composite keys in the same format: the base
# `workspaces` entry styles EVERY tag (use it to color the unselected icons);
# the `workspaces_selected` overlay applies only to the CURRENT tag, on top of
# it. The current tag's text falls back to selected_fg, the rest to text_color.
# workspaces_selected = bold # bolds only the selected tag's icon text (color falls back to selected_fg)

# Readout numbers pop in the focused accent, distinct from their labels
cpu_value        = primary_color # cpu readout number
ram_value        = primary_color # memory readout number
volume_value     = primary_color # volume slider number
brightness_value = primary_color # brightness slider number

# drun command runner colors (all optional; omit to use bar-wide defaults)
 # drun_bg           = "#0d0d14"  # background (default: bar bg)
 # drun_fg           = "#ebd9bc"  # typed text  (default: bar fg)
 # drun_prompt_color = primary_color  # prompt text + cursor (default: primary_color)
