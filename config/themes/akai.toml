### akai: hana WM default theme ###

# - HEX color code values can be set to either of the following formats:
#   "#RRGGBB" / RRGGBB / 0xRRGGBB
# - Any color knob also accepts a "mix" combining other colors: join them
#   with '+', optionally tagging each later operand with a percentage:
#     primary_color +(weight:25%) secondary_color     => 75% / 25%
#   The FIRST operand absorbs the remainder; a plain '+' is an even split.
#   Operands may be hex values or palette variable names. Use the 0xRRGGBB
#   (or quoted "#RRGGBB") spelling for a hex operand after the first, since a
#   bare '#' there starts a comment.

[tiling.aesthetics]
# Sizes take exact pixels (N / Npx) or a percentage (N%); the reversed '%N'
# spelling is not supported yet. A percentage resolves against HALF the screen
# height, because gaps and borders inset a window on two sides: e.g. 100% =
# half the display height, 0% = disabled. Use exact px for absolute control.
gap_width      = 2%
border_width   = 1%

# Borders follow the focus palette variables (from [bar] below)
border_focused   = primary_color
border_unfocused = secondary_color

[bar]
# Font
## First value is the default font used
## Subsequent values render in characters not included by first value (ej. non-ASCII)
fonts = [
    "FiraCode Nerd Font Propo Ret",
    "Noto Sans CJK JP", # japanese characters
]

# Bar height
## Auto-adapts to font size by default.
height = 3.5%

## Font size as a percentage of the bar's height (70% = glyphs occupy 70% of
## the bar's vertical space); the activity indicator scales the same way.
font_size      = 70%
indicator_size = 25%

# Workspace labels/icons (1-N)
icons = ["あ", "か", "い", "は", "な", "つ", "ん", "で"]

segment_spacing    = 5%
indicator_padding  = 40%

# Activity glyph drawn in each tag that has windows. The two keys are optional
# glyph overrides; unset uses the defaults shown below. indicator_location
# anchors the glyph inside the tag (up-left suits a bottom bar).
# indicator_focused   = "■"
# indicator_unfocused = "□"
indicator_location = "up-left"

# Workspace tag width as a percentage of the bar's height (100% = the bar's
# full height) or exact pixels
workspace_tag_width = 100%

# Bar transparency. Bare integers are percentages: 0% = fully transparent,
# 100% / 1.0 = fully opaque, 50% / 0.5 = half. (A bare `1` means 1% opacity,
# not 1.0; write `1.0` or `100%` for fully opaque.)
# With picom's gaussian blur, the bar will show blurred content behind it
transparency = 0% # [0.0 - 1.0] / [0% - 100%]

# drun command runner prompt string (default: "run: ")
drun_prompt = "$ "

#  Carousel (scrolling title)
# carousel_enabled: set to false to disable scrolling entirely and use a
#   static ellipsis when the title overflows.
carousel_enabled = true

# Main color palette
## Core palette: the editable colors. Every accent below inherits from
## these four; change one here and the whole bar follows.
primary_color     = "#ac3232" # focused title / selected workspace / active border
secondary_color   = "#52263e" # unfocused title / inactive border
alternative_color = "#007373" # minimized title
text_color        = "#ebd9bc" # bar text (matches fg)

# Bar
bg = "#0d0d14" 
fg = text_color

## Workspace tag indicators
selected_bg = primary_color  # follows primary_color
selected_fg = "#eeeeee"

# Per-segment accent colors inherit from the palette by reference
[bar.properties]
title           = primary_color       # focused title = primary_color
title_unfocused = secondary_color     # unfocused title = secondary_color
title_minimized = alternative_color   # minimized title + slider fill = alternative_color

# Per-segment text properties: any key that isn't a named color knob above is
# a segment registry name ("cpu", "mem", "volume", "brightness", "batt", ...).
# The first color-carrying item sets the text color; trailing style flags
# (underline/bold/italic, bare = true or name=true/1) set its style, e.g.
# `volume = alternative_color bold`. A style-only entry keeps the default fg.
# A segment with no entry falls back to the bar-wide fg (text_color).
# Per-segment NUMBER colors: the segment name + "_value" recolors just the
# numeric readout (the "42%" in "Cpu 42%"); the rest of the segment keeps its
# entry above. A segment with no `_value` entry colors its number like its
# label. Systatus readouts read secondary; slider text stays alternative,
# slider fill follows title_minimized (alternative).
cpu        = secondary_color   # cpu readout text
mem        = secondary_color   # memory readout text
volume     = alternative_color # volume slider text
brightness = alternative_color # brightness slider text

# Readout numbers pop in the focused accent, distinct from their labels
cpu_value        = primary_color # cpu readout number
mem_value        = primary_color # memory readout number
volume_value     = primary_color # volume slider number
brightness_value = primary_color # brightness slider number

# drun command runner colors (all optional; omit to use bar-wide defaults)
 # drun_bg           = "#0d0d14"  # background (default: bar bg)
 # drun_fg           = "#ebd9bc"  # typed text  (default: bar fg)
 # drun_prompt_color = primary_color  # prompt text + cursor (default: primary_color)
