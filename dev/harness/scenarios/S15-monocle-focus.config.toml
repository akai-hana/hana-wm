# S15 config override: monocle everywhere, gapless default variant.
[tiling]
enabled = true
border_width = 4
gap_width = 8
# Per-workspace layouts default every ws to the comptime first layout
# (master), so force the global path for this monocle-only scenario.
global_layout = true

layouts = ["monocle"]

[tiling.layouts.monocle]
variants = "gapless"

[bar]
enabled = true
position = "bottom"

[workspaces]
count = 4

[binds]
Mod = "Super"
Mod+Return = "auto_terminal"
Mod+F = "toggle_fullscreen"
Mod+Shift+F = "close_window"
Mod+S = "toggle_floating_window"
Mod+T = "minimize_window"
Mod+Shift+T = "unminimize_lifo"
Mod+Alt+T = "unminimize_fifo"
Mod+Shift+Alt+T = "unminimize_all"
Mod+{1-4} = "workspace"
Mod+Shift+{1-4} = "move_to_workspace"
Mod+A = "all_workspaces"
Mod+P = "move_to_all_workspaces"
Mod+W = "swap_master"
Mod+J = "focus_next_window"
Mod+K = "focus_prev_window"
Mod+Space = "toggle_layout"
Mod+E = "cycle_variants"
Mod+Shift+Y = "reload"
Mod+Q = "dump_state"
